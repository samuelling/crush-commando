name: Deploy

# On every push to main: deploy the multiplayer server to Cloudflare (when the CLOUDFLARE_API_TOKEN
# and CLOUDFLARE_ACCOUNT_ID secrets are set), point the game at it, and publish the site to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and check
        run: |
          sh tools/build.sh
          for f in hd/js/*.js server/*.js; do node --check "$f"; done

      - name: Deploy multiplayer server to Cloudflare
        id: worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        continue-on-error: true
        working-directory: server
        env:
          NO_COLOR: '1'
          FORCE_COLOR: '0'
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          deploy() { npx --yes wrangler@4 deploy 2>&1 | sed 's/\x1b\[[0-9;]*m//g' > deploy.log; return ${PIPESTATUS[0]}; }
          set +e
          deploy; code=$?
          # A new Cloudflare account has no workers.dev subdomain yet: register one, then try again.
          if [ $code -ne 0 ] && grep -q 'register a workers.dev subdomain' deploy.log; then
            owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr 'A-Z' 'a-z' | tr -cd 'a-z0-9-')
            for sub in "$owner" "$owner-games" "crush-commando-$GITHUB_REPOSITORY_ID"; do
              resp=$(curl -sS -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data "{\"subdomain\":\"$sub\"}" "$api")
              if echo "$resp" | grep -qE '"success": *true'; then echo "::notice title=Cloudflare::Registered $sub.workers.dev"; break; fi
              echo "::warning title=Cloudflare subdomain $sub::$(echo "$resp" | head -c 300)"
            done
            sleep 5
            deploy; code=$?
          fi
          set -e
          cat deploy.log
          if [ $code -ne 0 ]; then
            # surface Cloudflare's own error message on the run's summary page
            grep -iE 'error|✘|authentication|subdomain|permission|account' deploy.log | head -n 8 | while IFS= read -r line; do echo "::error title=Cloudflare deploy::$line"; done
            exit 1
          fi
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -n 1 || true)
          if [ -z "$url" ]; then
            sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).result.subdomain))")
            url="https://crush-commando-mp.$sub.workers.dev"
          fi
          echo "Multiplayer server: $url"
          echo "::notice title=Multiplayer server::$url"
          echo "wss=${url/https:/wss:}" >> "$GITHUB_OUTPUT"
          echo "https=$url" >> "$GITHUB_OUTPUT"

      - name: Check the multiplayer server
        if: steps.worker.outputs.https != ''
        continue-on-error: true
        working-directory: server
        env:
          NO_COLOR: '1'
        run: |
          # watch the server's own log while two test players connect
          npx --yes wrangler@4 tail crush-commando-mp --format json > tail.log 2>&1 &
          tail_pid=$!
          sleep 12
          set +e
          node probe.mjs "${{ steps.worker.outputs.https }}"
          code=$?
          sleep 6
          kill $tail_pid 2>/dev/null
          node -e "
            const lines = require('fs').readFileSync('tail.log', 'utf8').split('\\n');
            let n = 0;
            for (const l of lines) {
              let j; try { j = JSON.parse(l); } catch (_) { continue; }
              for (const x of j.exceptions || []) if (n++ < 6) console.log('::error title=Server exception::' + (x.name || '') + ': ' + (x.message || '').slice(0, 200));
              for (const x of j.logs || []) if (n++ < 6) console.log('::warning title=Server log::' + JSON.stringify(x.message).slice(0, 200));
              if (j.outcome && j.outcome !== 'ok' && n++ < 6) console.log('::warning title=Server outcome::' + j.outcome + ' ' + ((j.event && j.event.request && j.event.request.url) || ''));
            }
            console.log('tail lines: ' + lines.length);
          "
          exit $code

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html cc hd _site/
          if [ -n "${{ steps.worker.outputs.wss }}" ]; then
            echo "window.MP_SERVER = '${{ steps.worker.outputs.wss }}';" > _site/mp-config.js
          else
            echo "No Cloudflare secrets set: publishing in solo mode (rifts work, no multiplayer)."
            cp mp-config.js _site/mp-config.js
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: pages
        uses: actions/deploy-pages@v4
